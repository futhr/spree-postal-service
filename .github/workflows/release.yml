name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
      MUTANT_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: release-v4.7-rails-8.1
      - name: Verify release ref and version
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          expected_tag="v$(ruby -Ilib -rsolidus_weighted_shipping/version -e 'puts SolidusWeightedShipping::VERSION')"
          test "$GITHUB_REF_NAME" = "$expected_tag"
          ruby -Ilib -rsolidus_weighted_shipping/version -e 'abort "prerelease versions require a separate release decision" if Gem::Version.new(SolidusWeightedShipping::VERSION).prerelease?'
      - run: bin/rake quality:coverage
      - run: bin/rake quality:lint
      - run: bin/rake quality:mutation
      - run: bundle exec bundle-audit check --update
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
      - name: Record published artifact checksum
        run: sha256sum pkg/*.gem > pkg/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: released-gem-${{ github.ref_name }}
          path: |
            pkg/*.gem
            pkg/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
