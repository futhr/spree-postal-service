name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: gem install bundler-audit
      - run: bundle audit check --update
