name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: security-v4.7-rails-8.1
      - run: bundle exec bundle-audit check --update

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
