name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Solidus ${{ matrix.solidus }} / Rails ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            solidus: "v4.6"
            rails: "7.0"
          - ruby: "3.4"
            solidus: "v4.6"
            rails: "7.2"
          - ruby: "3.4"
            solidus: "v4.7"
            rails: "7.2"
          - ruby: "4.0"
            solidus: "v4.7"
            rails: "8.1"
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
      RUBYOPT: ${{ matrix.ruby == '3.2' && '-W:no-experimental' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: ${{ matrix.solidus }}-rails-${{ matrix.rails }}
      - run: bin/rake extension:specs

  quality:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: quality-v4.7-rails-8.1
      - run: bundle exec rake quality:coverage
      - run: bundle exec rake quality:lint
      - name: Upload coverage to Codecov
        if: >-
          vars.CODECOV_ENABLED == 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov/solidus-weighted-shipping.lcov
          disable_search: true
          fail_ci_if_error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "7.2"
      MUTANT_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: mutation-ruby-3.3-v4.7-rails-7.2
      - run: bundle exec rake quality:mutation

  browser:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: browser-v4.7-rails-8.1
      - run: bin/rake extension:test_app
      - run: bundle exec rspec spec/system
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: weighted-shipping-browser-evidence
          path: tmp/screenshots/
          if-no-files-found: error
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: "v4.7"
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: package-v4.7-rails-8.1
      - run: mkdir -p pkg
      - run: gem build solidus_weighted_shipping.gemspec --output pkg/solidus_weighted_shipping.gem
      - name: Inspect package metadata
        run: >-
          ruby -rrubygems/package
          -e 'spec = Gem::Package.new(ARGV.fetch(0)).spec; puts({name: spec.name, version: spec.version.to_s, ruby: spec.required_ruby_version.to_s})'
          pkg/solidus_weighted_shipping.gem
      - name: Install and load the packaged domain
        run: |
          package_home="$(mktemp -d)"
          gem install --local pkg/solidus_weighted_shipping.gem --install-dir "$package_home" --ignore-dependencies --no-document
          package_lib="$(find "$package_home/gems" -path '*/solidus_weighted_shipping-*/lib' -type d -print -quit)"
          ruby -I"$package_lib" -e 'require "solidus_weighted_shipping/domain"; abort unless SolidusWeightedShipping::RateTable.parse("1: 2").price_for("1") == 2'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solidus-weighted-shipping-gem
          path: pkg/solidus_weighted_shipping.gem
          if-no-files-found: error
          retention-days: 14

  solidus-edge:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      SOLIDUS_BRANCH: main
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: solidus-main-rails-8.1
      - run: bin/rake extension:specs
